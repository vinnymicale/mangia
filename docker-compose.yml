services:
  mangia:
    build: .
    image: mangia:latest
    restart: unless-stopped
    ports:
      - '3000:3000'
    volumes:
      - mangia-data:/data
    environment:
      DATABASE_URL: file:/data/mangia.db
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}

volumes:
  mangia-data:
